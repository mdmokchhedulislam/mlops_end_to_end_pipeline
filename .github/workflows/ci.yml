name: MLOps CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

# Prevent multiple CI runs for the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

  # Change these according to your registry
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/fraud-detector

jobs:

  # ============================================================
  # 1. LINT
  # ============================================================

  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          # python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff check
        run: |
          ruff check .

      - name: Ruff format check
        run: |
          ruff check . --fix


  # ============================================================
  # 2. UNIT TEST
  # ============================================================

  # test:
  #   name: Unit Tests
  #   runs-on: ubuntu-latest
  #   needs: lint

  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4

  #     - name: Setup Python
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: ${{ env.PYTHON_VERSION }}
  #         cache: pip

  #     - name: Install dependencies
  #       run: |
  #         python -m pip install --upgrade pip
  #         pip install -r requirements.txt
  #         pip install pytest pytest-cov

  #     - name: Run tests
  #       run: |
  #         pytest \
  #           -v \
  #           --tb=short \
  #           --cov=src \
  #           --cov-report=term-missing \
  #           --cov-report=xml

  #     - name: Upload coverage report
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: coverage-report
  #         path: coverage.xml


  # ============================================================
  # 3. DATA VALIDATION
  # ============================================================
  data-validation:
    name: Data Validation
    runs-on: self-hosted
    needs: lint

    env:
      # AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
      # AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}

      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: 13579mokMOK@

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[s3]"

      - name: Pull dataset from DVC
        run: |
          dvc pull

      - name: Validate project data
        run: |
          python -m src.data.validation


  # ============================================================
  # 4. SECRET SCAN
  # ============================================================

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 5. DEPENDENCY SECURITY SCAN
  # ============================================================

  # dependency-scan:
  #   name: Dependency Security Scan
  #   runs-on: ubuntu-latest
  #   needs: lint

  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4

  #     - name: Setup Python
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: ${{ env.PYTHON_VERSION }}

  #     - name: Install pip-audit
  #       run: |
  #         python -m pip install --upgrade pip
  #         pip install pip-audit

  #     - name: Audit dependencies
  #       run: |
  #         pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-2447 --ignore-vuln PYSEC-2026-113


  # # ============================================================
  # 6. DOCKER BUILD
  # ============================================================

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - data-validation
      - secret-scan
      # - dependency-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          push: false

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Export image to Docker archive
      # This allows Trivy to scan exactly the image built above.
      # --------------------------------------------------------

      - name: Build image archive
        run: |
          docker build \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

          docker save \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -o fraud-detector.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: fraud-detector.tar


  # ============================================================
  # 7. CONTAINER IMAGE SECURITY SCAN
  # ============================================================

  # image-scan:
  #   name: Trivy Image Scan
  #   runs-on: ubuntu-latest

  #   needs: docker-build

  #   steps:
  #     - name: Download Docker image
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: docker-image

  #     - name: Load Docker image
  #       run: |
  #         docker load \
  #           --input fraud-detector.tar

  #     - name: Run Trivy
  #       uses: aquasecurity/trivy-action@0.28.0
  #       with:
  #         image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
  #         format: table
  #         exit-code: 1
  #         ignore-unfixed: true
  #         vuln-type: os,library
  #         severity: CRITICAL,HIGH


  # ============================================================
  # 8. PUSH IMAGE TO REGISTRY
  # ============================================================

  push-image:
    name: Push Docker Image
    runs-on: ubuntu-latest

    # needs:
    #   - image-scan

    # ----------------------------------------------------------
    # IMPORTANT:
    # Only push from trusted branches.
    # Never push images from arbitrary PRs.
    # ----------------------------------------------------------

    if: |
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/develop'
      )

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          push: true

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # 9. CI SUMMARY
  # ============================================================

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest

    needs:
      - lint
      - data-validation
      - secret-scan
      # - dependency-scan
      - docker-build
      # - image-scan
      - push-image

    if: always()

    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ||
                "${{ needs.data-validation.result }}" != "success" ||
                "${{ needs.secret-scan.result }}" != "success" ||
                "${{ needs.docker-build.result }}" != "success" ||
                "${{ needs.push-image.result }}" != "success" ]]; then

            echo "CI FAILED"
            exit 1
          fi

          echo "CI PASSED"
          echo "Docker image successfully built and pushed."