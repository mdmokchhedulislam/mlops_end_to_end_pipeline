name: MLOps CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ============================================================
  # 1. LINT
  # ============================================================

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: |
          ruff check src api


  # ============================================================
  # 2. TEST
  # ============================================================

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v


  # ============================================================
  # 3. DVC DATA PIPELINE
  # ============================================================

  data-pipeline:
    name: DVC Data Pipeline
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------
      # Pull raw dataset
      # ----------------------------------------

      - name: Pull dataset with DVC
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DVC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.DVC_AWS_ENDPOINT_URL }}
        run: |
          dvc pull

      # ----------------------------------------
      # Run DVC data pipeline
      # ----------------------------------------

      - name: Run DVC pipeline
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DVC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.DVC_AWS_ENDPOINT_URL }}
        run: |
          dvc repro

      # ----------------------------------------
      # Upload processed dataset
      # ----------------------------------------

      - name: Upload processed dataset
        uses: actions/upload-artifact@v4
        with:
          name: processed-dataset
          path: |
            data/processed/raw_ingested.csv
            data/processed/processed_transactions.parquet


  # ============================================================
  # 4. TRAIN MODEL
  # ============================================================

  train:
    name: Train Model
    needs: data-pipeline
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------
      # Get processed dataset
      # ----------------------------------------

      - name: Download processed dataset
        uses: actions/download-artifact@v4
        with:
          name: processed-dataset
          path: data/processed

      # ----------------------------------------
      # Train
      # ----------------------------------------

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MLFLOW_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MLFLOW_AWS_SECRET_ACCESS_KEY }}
          MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}
        run: |
          python -m src.training.train


  # ============================================================
  # 5. EVALUATION
  # ============================================================

  evaluate:
    name: Evaluate Model
    needs: train
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download processed dataset
        uses: actions/download-artifact@v4
        with:
          name: processed-dataset
          path: data/processed

      # ----------------------------------------
      # Evaluate
      # ----------------------------------------

      - name: Evaluate model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MLFLOW_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MLFLOW_AWS_SECRET_ACCESS_KEY }}
          MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}
        run: |
          python -m src.evaluation.evaluate


  # ============================================================
  # 6. QUALITY GATE
  # ============================================================

  quality-gate:
    name: Model Quality Gate
    needs: evaluate
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check model quality
        run: |
          python -m src.evaluation.quality_gate


  # ============================================================
  # 7. MODEL REGISTRY
  # ============================================================

  register:
    name: Register Model
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Register model in MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MLFLOW_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MLFLOW_AWS_SECRET_ACCESS_KEY }}
          MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}
        run: |
          python -m src.registry.register


  # ============================================================
  # 8. BUILD AND PUSH DOCKER IMAGE
  # ============================================================

  docker:
    name: Build and Push Docker Image
    needs: register
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # Login
      # ----------------------------------------

      - name: Login to Docker Registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | \
          docker login \
            "${{ secrets.REGISTRY_URL }}" \
            -u "${{ secrets.REGISTRY_USERNAME }}" \
            --password-stdin

      # ----------------------------------------
      # Build
      # ----------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ secrets.REGISTRY_URL }}/fraud-api:${{ github.sha }}" \
            .

      # ----------------------------------------
      # Push
      # ----------------------------------------

      - name: Push Docker image
        run: |
          docker push \
            "${{ secrets.REGISTRY_URL }}/fraud-api:${{ github.sha }}"