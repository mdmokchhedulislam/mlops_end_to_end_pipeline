name: MLOps CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main


# ============================================================
# GLOBAL PERMISSIONS
# ============================================================

permissions:
  contents: read


# Prevent multiple deployments/training pipelines from racing
# on the same branch.
concurrency:
  group: mlops-${{ github.ref }}
  cancel-in-progress: false


jobs:

  # ============================================================
  # 1. CODE QUALITY
  # Runs on PR and main
  # ============================================================

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Ruff
        run: |
          python -m pip install ruff

      - name: Ruff
        run: |
          ruff check src api


  # ============================================================
  # 2. TEST
  # Runs on PR and main
  # ============================================================

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Pytest
        run: |
          python -m pip install pytest

      - name: Run tests
        run: |
          pytest -v


  # ============================================================
  # 3. DVC DATA PIPELINE
  #
  # Only runs after lint + test
  #
  # DVC responsibility:
  #
  # raw dataset
  #      ↓
  # ingestion
  #      ↓
  # preprocessing
  #      ↓
  # validation
  #
  # NO TRAINING HERE
  # ============================================================

  data-pipeline:
    name: DVC Data Pipeline
    needs: test

    # Don't train models for PRs.
    # Full ML pipeline runs only after merge/push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # Pull raw dataset from DVC remote
      # --------------------------------------------------------

      - name: DVC Pull
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DVC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.DVC_AWS_ENDPOINT_URL }}
        run: |
          dvc pull

      # --------------------------------------------------------
      # Run:
      #
      # ingestion.py
      # preprocessing.py
      # validation.py
      # --------------------------------------------------------

      - name: Run DVC pipeline
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DVC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.DVC_AWS_ENDPOINT_URL }}
        run: |
          dvc repro

      # --------------------------------------------------------
      # Upload ONLY processed data for next CI job
      #
      # This is not model storage.
      # Model stays in MLflow.
      # --------------------------------------------------------

      - name: Upload processed dataset
        uses: actions/upload-artifact@v4
        with:
          name: processed-dataset
          if-no-files-found: error
          retention-days: 1
          path: |
            data/processed/raw_ingested.csv
            data/processed/processed_transactions.parquet


  # ============================================================
  # 4. TRAIN MODEL
  #
  # Model goes directly to MLflow.
  #
  # We do NOT upload model.pkl as GitHub artifact.
  #
  # train.py MUST create:
  #
  # mlflow_run_id.txt
  #
  # containing the MLflow Run ID.
  # ============================================================

  train:
    name: Train Model
    needs: data-pipeline

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # Get processed dataset
      # --------------------------------------------------------

      - name: Download processed dataset
        uses: actions/download-artifact@v4
        with:
          name: processed-dataset
          path: data/processed

      # --------------------------------------------------------
      # Train
      # --------------------------------------------------------

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

          AWS_ACCESS_KEY_ID: ${{ secrets.MLFLOW_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MLFLOW_AWS_SECRET_ACCESS_KEY }}

          MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}

        run: |
          python -m src.training.train

      # --------------------------------------------------------
      # Verify MLflow Run ID was created
      # --------------------------------------------------------

      - name: Verify MLflow Run ID
        run: |
          test -f mlflow_run_id.txt
          test -s mlflow_run_id.txt

          echo "MLflow Run ID:"
          cat mlflow_run_id.txt

      # --------------------------------------------------------
      # Pass ONLY metadata to next job
      # --------------------------------------------------------

      - name: Upload MLflow run metadata
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-run-metadata
          if-no-files-found: error
          retention-days: 1
          path: |
            mlflow_run_id.txt


  # ============================================================
  # 5. EVALUATION
  #
  # Evaluation loads model from MLflow using Run ID.
  # ============================================================

  evaluate:
    name: Evaluate Model
    needs: train

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # Processed dataset
      # --------------------------------------------------------

      - name: Download processed dataset
        uses: actions/download-artifact@v4
        with:
          name: processed-dataset
          path: data/processed

      # --------------------------------------------------------
      # MLflow Run ID
      # --------------------------------------------------------

      - name: Download MLflow run metadata
        uses: actions/download-artifact@v4
        with:
          name: mlflow-run-metadata
          path: .

      - name: Read MLflow Run ID
        shell: bash
        run: |
          RUN_ID=$(cat mlflow_run_id.txt)

          echo "MLFLOW_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

          echo "Evaluating MLflow Run:"
          echo "$RUN_ID"

      # --------------------------------------------------------
      # Evaluate
      # --------------------------------------------------------

      - name: Evaluate model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

          AWS_ACCESS_KEY_ID: ${{ secrets.MLFLOW_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MLFLOW_AWS_SECRET_ACCESS_KEY }}

          MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}

          MLFLOW_RUN_ID: ${{ env.MLFLOW_RUN_ID }}

        run: |
          python -m src.evaluation.evaluate

      # --------------------------------------------------------
      # Evaluation must produce metrics
      # --------------------------------------------------------

      - name: Verify evaluation metrics
        run: |
          test -f metrics.json
          test -s metrics.json

      # --------------------------------------------------------
      # Pass metrics to Quality Gate
      # --------------------------------------------------------

      - name: Upload evaluation metrics
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-metrics
          if-no-files-found: error
          retention-days: 1
          path: |
            metrics.json

      # Pass Run ID again
      - name: Upload MLflow run metadata
        uses: actions/upload-artifact@v4
        with:
          name: evaluated-run
          if-no-files-found: error
          retention-days: 1
          path: |
            mlflow_run_id.txt


  # ============================================================
  # 6. QUALITY GATE
  #
  # If this fails:
  #
  # Registry ❌
  # Docker    ❌
  #
  # ============================================================

  quality-gate:
    name: Model Quality Gate
    needs: evaluate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # Download metrics
      # --------------------------------------------------------

      - name: Download evaluation metrics
        uses: actions/download-artifact@v4
        with:
          name: evaluation-metrics
          path: .

      # --------------------------------------------------------
      # Quality Gate
      # --------------------------------------------------------

      - name: Run quality gate
        run: |
          python -m src.evaluation.quality_gate

      # --------------------------------------------------------
      # Explicit verification
      # --------------------------------------------------------

      - name: Verify quality gate
        run: |
          echo "Model Quality Gate PASSED"


  # ============================================================
  # 7. MODEL REGISTRY
  #
  # Only runs when quality gate passes.
  # ============================================================

  register:
    name: Register Model
    needs: quality-gate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # Get exact MLflow Run ID
      # --------------------------------------------------------

      - name: Download MLflow run metadata
        uses: actions/download-artifact@v4
        with:
          name: evaluated-run
          path: .

      - name: Read MLflow Run ID
        shell: bash
        run: |
          RUN_ID=$(cat mlflow_run_id.txt)

          echo "MLFLOW_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

          echo "Registering MLflow Run:"
          echo "$RUN_ID"

      # --------------------------------------------------------
      # Register
      # --------------------------------------------------------

      - name: Register model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

          AWS_ACCESS_KEY_ID: ${{ secrets.MLFLOW_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MLFLOW_AWS_SECRET_ACCESS_KEY }}

          MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}

          MLFLOW_RUN_ID: ${{ env.MLFLOW_RUN_ID }}

        run: |
          python -m src.registry.register


  # ============================================================
  # 8. DOCKER BUILD + PUSH
  #
  # Docker contains API/application.
  #
  # Model remains in MLflow.
  # ============================================================

  docker:
    name: Build and Push API Image
    needs: register

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Login
      # --------------------------------------------------------

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # --------------------------------------------------------
      # Build
      #
      # IMPORTANT:
      # This Dockerfile should contain FastAPI serving code.
      # It should NOT train the model.
      # --------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ secrets.REGISTRY_URL }}/fraud-api:${{ github.sha }}" \
            -t "${{ secrets.REGISTRY_URL }}/fraud-api:latest" \
            .

      # --------------------------------------------------------
      # Push immutable SHA tag
      # --------------------------------------------------------

      - name: Push SHA image
        run: |
          docker push \
            "${{ secrets.REGISTRY_URL }}/fraud-api:${{ github.sha }}"

      # --------------------------------------------------------
      # Push latest
      # --------------------------------------------------------

      - name: Push latest image
        run: |
          docker push \
            "${{ secrets.REGISTRY_URL }}/fraud-api:latest"