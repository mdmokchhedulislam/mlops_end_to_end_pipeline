name: MLOps CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: mlops-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: minioadmin
  # AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ROOT_USER }}
  AWS_SECRET_ACCESS_KEY: 13579mokMOK@
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT: fraud-detection
  MLFLOW_MODEL_NAME: fraud-detection-model
  MLFLOW_MODEL_ALIAS: champion

jobs:

  # ==================================================================
  # 1) Lint + Unit Tests — fast, no infra dependency
  # # ==================================================================
  # lint-and-test:
  #   name: Lint & Unit Tests
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4

  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.12"
  #         cache: pip
  #         cache-dependency-path: requirements.txt

  #     - name: Install dependencies
  #       run: |
  #         python -m pip install --upgrade pip
  #         pip install -r requirements.txt

  #     - name: Lint
  #       run: ruff check src api tests

  #     - name: Unit tests
  #       run: pytest tests/ -v --cov=src --cov-report=term-missing

  # ==================================================================
  # 2) DVC pipeline — data + training + evaluation.
  #    DVC's job ends at "did this reproduce", it makes no promotion
  #    decision. Needs the self-hosted runner with MinIO/MLflow access.
  # ==================================================================
  dvc-pipeline:
    name: DVC Pipeline (data -> train -> evaluate)
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DVC pull
        run: dvc pull

      - name: Run DVC pipeline
        run: dvc repro

      - name: Push updated DVC artifacts
        run: dvc push

      - name: Upload run reference
        uses: actions/upload-artifact@v4
        with:
          name: run-id
          path: reports/run_id.txt
          retention-days: 7

  # ==================================================================
  # 3) Quality gate + registration — pure MLflow, no DVC involvement.
  #    A failing gate stops the pipeline here; nothing downstream runs.
  # ==================================================================
  quality-gate-and-register:
    name: Quality Gate & Register Model
    needs: dvc-pipeline
    runs-on: self-hosted
    outputs:
      promoted: ${{ steps.register.outputs.promoted }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quality gate
        run: python -m src.model.quality_gate

      - name: Register model
        id: register
        run: |
          python -m src.model.register_model
          echo "promoted=true" >> "$GITHUB_OUTPUT"

  # ==================================================================
  # 4) Build & push Docker image — only if a new model was promoted
  # ==================================================================
  build-and-push:
    name: Build & Push Docker Image
    needs: quality-gate-and-register
    if: needs.quality-gate-and-register.outputs.promoted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================================================================
