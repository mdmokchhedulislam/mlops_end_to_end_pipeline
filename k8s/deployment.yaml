apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detector
  namespace: mlops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fraud-detector

  template:
    metadata:
      labels:
        app: fraud-detector

    spec:
      containers:
        - name: fraud-detector

          image: YOUR_DOCKERHUB_USERNAME/fraud-detector:v1.0.0

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - secretRef:
                name: mlops-secrets

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20