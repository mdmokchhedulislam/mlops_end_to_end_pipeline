apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: fraud-detector
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/mdmokchhedulislam/mlops_end_to_end_pipeline.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: mlops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true